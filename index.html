<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>My Diary ✨</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="editBtn"
      class="edit-trigger-fixed"
      onclick="openProfileModal()"
      style="display: none"
    >
      ✏️
    </div>

    <div id="profileModal" class="modal-overlay">
      <div class="edit-card">
        <h3 id="modalTitle">Xush kelibsiz! ✨</h3>
        <p style="font-size: 12px; margin-bottom: 10px; opacity: 0.8">
          Kundalikingizni shaxsiylashtirish uchun ismingizni yozing
        </p>
        <input type="text" id="userNameInput" placeholder="исм" />
        <textarea id="userBioInput" placeholder="биография" rows="3"></textarea>
        <div class="modal-actions">
          <button class="btn-main" onclick="updateProfile()">Saqlash ✨</button>
        </div>
      </div>
    </div>

    <div class="app-wrapper">
      <header class="header">
        <div class="avatar-container">
          <div class="avatar-circle">🧚🏻‍♀️</div>
        </div>
        <h1 id="displayName">Ism...</h1>
        <p id="displayBio" class="bio-text">Biografiya...</p>
      </header>

      <section class="post-creator">
        <div class="glass-input">
          <textarea id="postInput" placeholder="бугун нма клдм?"></textarea>
          <div id="imgPreviewContainer"></div>

          <div class="input-footer">
            <div class="emoji-bar">
              <!-- <span onclick="addEmoji('✨')">✨</span>
              <span onclick="addEmoji('🌸')">🌸</span>
              <span onclick="addEmoji('🌙')">🌙</span> -->
            </div>
            <div class="btns">
              <label class="btn-icon">
                📷
                <input
                  type="file"
                  id="imageInput"
                  accept="image/*"
                  onchange="previewImage()"
                  hidden
                />
              </label>
              <button class="btn-main" onclick="addPost()">Saqlash ✨</button>
            </div>
          </div>
        </div>
      </section>

      <main id="diaryContainer" class="posts-list">
        <div class="list-header">
          <h2>Xotiralar</h2>
          <div class="divider"></div>
        </div>
      </main>
    </div>

    <script>
      let selectedImageData = "";

      document.addEventListener("DOMContentLoaded", () => {
        checkUserStatus();
        renderPosts();
      });

      // 1. Birinchi marta kirishni tekshirish
      function checkUserStatus() {
        const savedProfile = JSON.parse(localStorage.getItem("user_profile"));
        if (!savedProfile) {
          // Agar ma'lumot yo'q bo'lsa, modalni ochish
          document.getElementById("profileModal").style.display = "flex";
          document.getElementById("editBtn").style.display = "none";
        } else {
          // Bor bo'lsa, ma'lumotlarni chiqarish va qalamchani ko'rsatish
          displayProfile(savedProfile);
          document.getElementById("editBtn").style.display = "flex";
          document.getElementById("profileModal").style.display = "none";
        }
      }

      // 2. Profilni saqlash
      function updateProfile() {
        const nameVal = document.getElementById("userNameInput").value;
        const bioVal = document.getElementById("userBioInput").value;

        if (nameVal.trim() === "") {
          alert("Iltimos, ismingizni kiriting!");
          return;
        }

        const profileData = { name: nameVal, bio: bioVal };
        localStorage.setItem("user_profile", JSON.stringify(profileData));

        displayProfile(profileData);
        document.getElementById("profileModal").style.display = "none";
        document.getElementById("editBtn").style.display = "flex";
      }

      function displayProfile(data) {
        document.getElementById("displayName").innerText = data.name;
        document.getElementById("displayBio").innerText =
          data.bio || "Hayotim xotiralari...";
      }

      function openProfileModal() {
        const savedProfile = JSON.parse(localStorage.getItem("user_profile"));
        if (savedProfile) {
          document.getElementById("userNameInput").value = savedProfile.name;
          document.getElementById("userBioInput").value = savedProfile.bio;
          document.getElementById("modalTitle").innerText = "Tahrirlash ✨";
        }
        document.getElementById("profileModal").style.display = "flex";
      }

      // 3. Post qo'shish funksiyalari
      function addEmoji(emoji) {
        const input = document.getElementById("postInput");
        input.value += emoji;
        input.focus();
      }

      function previewImage() {
        const file = document.getElementById("imageInput").files[0];
        const reader = new FileReader();
        reader.onloadend = () => {
          selectedImageData = reader.result;
          document.getElementById(
            "imgPreviewContainer"
          ).innerHTML = `<img src="${selectedImageData}" class="preview-img">`;
        };
        if (file) reader.readAsDataURL(file);
      }

      function addPost() {
        const input = document.getElementById("postInput");
        if (input.value.trim() === "" && !selectedImageData) return;

        const now = new Date();
        const dateStr =
          now.toLocaleDateString("uz-UZ") +
          ", " +
          now.getHours() +
          ":" +
          now.getMinutes().toString().padStart(2, "0");

        const newPostObj = {
          id: Date.now(),
          date: dateStr,
          content: input.value,
          image: selectedImageData,
        };

        let posts = JSON.parse(localStorage.getItem("mashkura_diary")) || [];
        posts.unshift(newPostObj);
        localStorage.setItem("mashkura_diary", JSON.stringify(posts));

        renderPosts();
        input.value = "";
        selectedImageData = "";
        document.getElementById("imgPreviewContainer").innerHTML = "";
      }

      function renderPosts() {
        const container = document.getElementById("diaryContainer");
        const posts = JSON.parse(localStorage.getItem("mashkura_diary")) || [];

        // Faqat list-header ni saqlab, qolganini tozalash
        container.innerHTML = `
                <div class="list-header">
                    <h2>Xotiralar</h2>
                    <div class="divider"></div>
                </div>`;

        posts.forEach((post) => {
          const postDiv = document.createElement("div");
          postDiv.className = "post";
          let imgHtml = post.image
            ? `<img src="${post.image}" class="post-thumb">`
            : "";

          postDiv.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size:12px; opacity:0.6; margin-bottom:8px;">
                        <span>${post.date}</span>
                        <span style="cursor:pointer" onclick="deletePost(${post.id})">×</span>
                    </div>
                    <p style="font-size:15px; line-height:1.5;">${post.content}</p>
                    ${imgHtml}
                `;
          container.appendChild(postDiv);
        });
      }

      function deletePost(id) {
        if (confirm("Ushbu xotirani o'chirmoqchimisiz?")) {
          let posts = JSON.parse(localStorage.getItem("mashkura_diary")) || [];
          posts = posts.filter((p) => p.id !== id);
          localStorage.setItem("mashkura_diary", JSON.stringify(posts));
          renderPosts();
        }
      }
    </script>
  </body>
</html>
